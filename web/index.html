<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="シフト管理と家計予測のアプリ">

  <!-- Gmail連携（Web版）のOAuthクライアントID。秘密情報ではなくアプリに埋め込む前提のもの。 -->
  <meta name="google-signin-client_id"
        content="412954770214-1h707o201v0dienr4b3889ckkkgthfdv.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ポケットメイド">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ポケットメイド</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 💡 iOSでURLバーの出入りに追従できるよう、高さを画面いっぱいに固定する */
    html, body { height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // 💡 iOSはURLバーの出し入れやキーボードで表示領域が変わるが、Flutterが
    //   その変化を取りこぼし、下のタブバーが浮いて下に余白が出ることがある。
    //   表示領域の変化を拾って、Flutterに測り直させる。
    (function () {
      var vv = window.visualViewport;
      var timer;
      function nudge() {
        clearTimeout(timer);
        timer = setTimeout(function () {
          window.dispatchEvent(new Event('resize'));
        }, 120);
      }
      if (vv) {
        vv.addEventListener('resize', nudge);
        vv.addEventListener('scroll', nudge);
      }
      window.addEventListener('orientationchange', nudge);
      // 別ページ（Googleの許可画面など）から戻ってきたときにも測り直す
      window.addEventListener('pageshow', nudge);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') nudge();
      });
    })();
  </script>

  <script>
    // 💡 Service Worker が古いビルドを配り続けて「直したのに反映されない」が
    //   起きるため、新しいビルドを見つけたら即座に切り替えて読み込み直す。
    //   （ホーム画面に追加したPWAは特に強くキャッシュするので必須）
    (function () {
      if (!('serviceWorker' in navigator)) return;

      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading) return; // reload のループを防ぐ
        reloading = true;
        window.location.reload();
      });

      function activateWhenReady(reg) {
        // 待機中の新ビルドがあれば、すぐ有効化させる
        // （Flutter生成の service worker は 'skipWaiting' メッセージを受け付ける）
        if (reg.waiting) reg.waiting.postMessage('skipWaiting');
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              sw.postMessage('skipWaiting');
            }
          });
        });
      }

      navigator.serviceWorker.ready.then(function (reg) {
        activateWhenReady(reg);
        reg.update(); // 起動のたびに新しいビルドが無いか確認する
      });

      // 画面に戻ってきたときも確認する（開きっぱなしのPWA対策）
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState !== 'visible') return;
        navigator.serviceWorker.ready.then(function (reg) { reg.update(); });
      });
    })();
  </script>
</body>
</html>
